name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile

  regression-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node infra/benchmark_regression_guard.js --baseline infra/benchmarks/baseline.sample.json --current infra/benchmarks/current.sample.json --throughput-threshold 10 --p99-threshold 15 --error-threshold 0.2
